[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "ticketparse"
version = "0.1.0"
description = "Learning-first scaffold for schema-constrained JSON extraction with QLoRA and DPO."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]
train = [
  "accelerate>=0.30",
  "datasets>=2.18",
  "evaluate>=0.4",
  "peft>=0.10",
  "transformers>=4.40",
  "trl>=0.8",
]
inference = [
  "vllm>=0.4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ticketparse"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
